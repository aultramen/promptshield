name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Contract, abuse checks, stored evidence and document links
        run: python -m unittest discover -s tests/contracts -p "test_*.py"
      - name: Synthetic terminal scenarios at 80 and 120 columns
        run: python .scratch/prototypes/promptshield-ui-v1/review.py --scenario-suite --widths 80,120 --evidence-dir "${{ runner.temp }}/promptshield-scenarios"
      - name: Product document structure
        run: |
          node .agent/tools/doc-lint.mjs docs/prd/prd-promptshield-v1.md --advisory --requires-hld
          node .agent/tools/doc-lint.mjs docs/fsd/fsd-promptshield-v1.md --advisory --requires-hld
          node .agent/tools/doc-lint.mjs .scratch/promptshield-v1/PROGRESS.md --advisory
          node .agent/tools/doc-lint.mjs .scratch/promptshield-v1/issues/02-native-subscription-slice.md --advisory
